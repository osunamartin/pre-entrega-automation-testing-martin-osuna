[pytest]
addopts = -v --html=reports/report.html --self-contained-html

# Pytest-html: SOLO se configuran estos valores válidos en pytest.ini:
#   - html = ruta del reporte
#   - self_contained_html = true/false
# Títulos y descripciones NO van en pytest.ini.
# Se definen en el hook pytest_html_report_title.

# Marcadores
markers =
    smoke: pruebas críticas y rápidas
    api: pruebas de API
    ui: pruebas de interfaz
